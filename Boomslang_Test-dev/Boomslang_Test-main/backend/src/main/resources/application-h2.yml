spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  
  datasource:
    url: jdbc:h2:mem:everx;MODE=PostgreSQL;TRACE_LEVEL_SYSTEM_OUT=0
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  flyway:
    enabled: false
  
  sql:
    init:
      mode: never

logging:
  level:
    root: WARN
    com.everx: INFO
    org.springframework.web: INFO

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
