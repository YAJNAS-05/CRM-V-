spring:
  application:
    name: everx-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/everx_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

everx:
  init-mock-data: false
  reporting:
    allow-mock-fallback: false
  security:
    supabase-chain:
      enabled: false
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-this-in-production-minimum-512-bits-for-hs512-algorithm-safety}
    access-expiry-ms: 900000
    refresh-expiry-ms: 604800000
  
  currency-api:
    url: ${CURRENCY_API_URL:https://api.exchangerate-api.com/v4/latest}
    key: ${CURRENCY_API_KEY}
    timeout-ms: 10000
  
  mail:
    from: ${MAIL_FROM:noreply@everx.com}
    from-name: "EverX System"
  
  s3:
    bucket: ${S3_BUCKET:everx-documents}
    endpoint: ${S3_ENDPOINT:https://s3.amazonaws.com}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_KEY}
    secret-key: ${S3_SECRET}
    use-path-style-access: false

logging:
  level:
    root: INFO
    com.everx: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
