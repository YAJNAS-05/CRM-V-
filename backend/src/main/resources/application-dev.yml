spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/everx
    username: everx_user
    password: everx_pass
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

everx:
  jwt:
    access-expiry-ms: 28800000  # 8 hours for development

logging:
  level:
    root: INFO
    com.everx: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  error:
    include-message: always
    include-binding-errors: always

# Disable mail health checks in development to avoid failing actuator when SMTP is
# not configured for local runs.
management:
  health:
    mail:
      enabled: false
