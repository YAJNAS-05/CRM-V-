services:
  postgres:
    image: postgres:16-alpine
    container_name: everx-postgres
    environment:
      POSTGRES_DB: everx_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - everx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d everx_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  everx_pg_data:
